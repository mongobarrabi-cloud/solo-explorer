version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: soloexplorer-app_web_1
      APP_PORT: 80

  web:
    image: python:3.11-alpine
    restart: unless-stopped
    working_dir: /app
    command: python3 -c "import urllib.request, http.server, socketserver; urllib.request.urlretrieve('https://githubusercontent.com', 'index.html'); socketserver.TCPServer(('', 80), http.server.SimpleHTTPRequestHandler).serve_forever()"

